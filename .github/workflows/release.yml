name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/tests.yml

  release:
    name: Build draft release
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, xml, ctype, json, bcmath, curl, gd, fileinfo, zip, intl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install PHP Dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Extract Version
        id: version
        run: |
          echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          echo "version=$(php -r 'require "vendor/autoload.php"; $config = require "config/nebula.php"; echo $config["version"];')" >> "$GITHUB_OUTPUT"

      - name: Verify Tag Matches Config Version
        run: |
          if [ "v${{ steps.version.outputs.version }}" != "${{ steps.version.outputs.tag }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} does not match config/nebula.php version ${{ steps.version.outputs.version }}."
            exit 1
          fi

      - name: Create Release Archive
        run: |
          zip -r nebulacms-${{ steps.version.outputs.tag }}.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x "node_modules/*" \
            -x "tests/*" \
            -x ".env" \
            -x "*.lock" \
            -x "storage/logs/*" \
            -x "storage/framework/cache/data/*" \
            -x "storage/app/public/*" \
            -x "phpunit.xml" \
            -x "phpstan.neon" \
            -x "phpstan-baseline.neon" \
            -x "vite.config.ts" \
            -x "tsconfig*.json" \
            -x "eslint.config.js" \
            -x "postcss.config.js" \
            -x "tailwind.config.*" \
            -x ".prettierrc" \
            -x ".editorconfig"

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nebulacms-${{ steps.version.outputs.tag }}.zip
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref, '-beta') || contains(github.ref, '-alpha') || contains(github.ref, '-rc') }}

      - name: Signing Instructions
        run: |
          cat <<'EOF'
          Draft release created. Before publishing:

            1. Download nebulacms-${{ steps.version.outputs.tag }}.zip from the draft release
               (or reuse the workflow artifact) to the machine that holds ~/.nebula/keys.
            2. php tools/nebula-pack.php sign-file nebulacms-${{ steps.version.outputs.tag }}.zip \
                 --type=core --version=${{ steps.version.outputs.version }} --out=dist
            3. gh release upload ${{ steps.version.outputs.tag }} \
                 dist/nebulacms-${{ steps.version.outputs.tag }}.zip.sig.json
            4. gh release edit ${{ steps.version.outputs.tag }} --draft=false

          Updates are only trusted once the .sig.json is attached and verifies.
          EOF
